<line x1="303.125" y1="150.0" x2="200.0" y2="325.0" stroke="#64748b" stroke-width="1.5"/>
<line x1="303.125" y1="150.0" x2="241.25" y2="220.0" stroke="#64748b" stroke-width="1.5"/>
<line x1="117.5" y1="185.0" x2="200.0" y2="325.0" stroke="#64748b" stroke-width="1.5"/>
<line x1="117.5" y1="185.0" x2="241.25" y2="220.0" stroke="#64748b" stroke-width="1.5"/>
<line x1="117.5" y1="185.0" x2="179.375" y2="255.0" stroke="#64748b" stroke-width="1.5"/>
<line x1="200.0" y1="325.0" x2="241.25" y2="220.0" stroke="#64748b" stroke-width="1.5"/>
<line x1="200.0" y1="325.0" x2="179.375" y2="255.0" stroke="#64748b" stroke-width="1.5"/>
<line x1="200.0" y1="325.0" x2="200.0" y2="290.0" stroke="#64748b" stroke-width="1.5"/>
