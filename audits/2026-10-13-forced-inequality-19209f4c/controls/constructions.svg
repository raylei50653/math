<circle cx="365.0" cy="80.0" r="13" fill="#60a5fa" stroke="#0f172a" stroke-width="1.3"/>
<text x="365.0" y="80.0" class="node">1</text>
<circle cx="76.25" cy="115.0" r="13" fill="#fbbf24" stroke="#0f172a" stroke-width="1.3"/>
