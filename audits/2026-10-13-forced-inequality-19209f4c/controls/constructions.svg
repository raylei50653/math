<circle cx="855" cy="215" r="13" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.3"/>
<text x="855" y="215" class="node">b</text>
<circle cx="855" cy="325" r="13" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.3"/>
<text x="855" y="325" class="node">v</text>
<circle cx="1130" cy="105" r="13" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.3"/>
<text x="1130" y="105" class="node">x</text>
<circle cx="1130" cy="215" r="13" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.3"/>
<text x="1130" y="215" class="node">y</text>
<circle cx="1130" cy="325" r="13" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.3"/>
<text x="1130" y="325" class="node">z</text>
<text x="820" y="409" class="note">Two hubs a,b plus branch vertex v</text>
<text x="820" y="432" class="note">connect to all three neighbors x,y,z.</text>
<text x="820" y="455" class="note">This is K3,3: crossings are unavoidable.</text>
</svg>
