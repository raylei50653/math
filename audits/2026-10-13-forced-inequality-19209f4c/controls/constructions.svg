<circle cx="200.0" cy="290.0" r="13" fill="#60a5fa" stroke="#0f172a" stroke-width="1.3"/>
<text x="200.0" y="290.0" class="node">9</text>
<text x="30" y="409" class="note">All colorings: c(i) = c(i mod 4).</text>
<text x="30" y="432" class="note">0 and 9 differ; graph distance = 3.</text>
<text x="30" y="455" class="note">Continue stacking: no distance bound.</text>
<text x="425" y="35" class="title">B. Shared two-color support</text>
<line x1="435" y1="105" x2="435" y2="355" stroke="#64748b" stroke-width="1.5"/>
<line x1="435" y1="105" x2="475" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="435" y1="105" x2="530" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="435" y1="105" x2="585" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="435" y1="105" x2="640" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="435" y1="105" x2="695" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="435" y1="355" x2="475" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="435" y1="355" x2="530" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="435" y1="355" x2="585" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="435" y1="355" x2="640" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="435" y1="355" x2="695" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="475" y1="230" x2="530" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="530" y1="230" x2="585" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="585" y1="230" x2="640" y2="230" stroke="#64748b" stroke-width="1.5"/>
<line x1="640" y1="230" x2="695" y2="230" stroke="#64748b" stroke-width="1.5"/>
<circle cx="435" cy="105" r="13" fill="#fb7185" stroke="#0f172a" stroke-width="1.3"/>
<text x="435" y="105" class="node">a</text>
<circle cx="435" cy="355" r="13" fill="#60a5fa" stroke="#0f172a" stroke-width="1.3"/>
<text x="435" y="355" class="node">b</text>
<circle cx="475" cy="230" r="13" fill="#fbbf24" stroke="#0f172a" stroke-width="1.3"/>
<text x="475" y="230" class="node">x0</text>
<circle cx="530" cy="230" r="13" fill="#86efac" stroke="#0f172a" stroke-width="1.3"/>
<text x="530" y="230" class="node">x1</text>
<circle cx="585" cy="230" r="13" fill="#fbbf24" stroke="#0f172a" stroke-width="1.3"/>
<text x="585" y="230" class="node">x2</text>
<circle cx="640" cy="230" r="13" fill="#86efac" stroke="#0f172a" stroke-width="1.3"/>
<text x="640" y="230" class="node">x3</text>
<circle cx="695" cy="230" r="13" fill="#fbbf24" stroke="#0f172a" stroke-width="1.3"/>
<text x="695" y="230" class="node">x4</text>
<text x="425" y="409" class="note">The path alternates between two colors.</text>
<text x="425" y="432" class="note">Its endpoints still have distance 2.</text>
<text x="425" y="455" class="note">Shared support creates shortcuts.</text>
<text x="820" y="35" class="title">C. A three-way fork fails</text>
<line x1="855" y1="105" x2="1130" y2="105" stroke="#64748b" stroke-width="1.5"/>
<line x1="855" y1="105" x2="1130" y2="215" stroke="#64748b" stroke-width="1.5"/>
<line x1="855" y1="105" x2="1130" y2="325" stroke="#64748b" stroke-width="1.5"/>
<line x1="855" y1="215" x2="1130" y2="105" stroke="#64748b" stroke-width="1.5"/>
<line x1="855" y1="215" x2="1130" y2="215" stroke="#64748b" stroke-width="1.5"/>
<line x1="855" y1="215" x2="1130" y2="325" stroke="#64748b" stroke-width="1.5"/>
<line x1="855" y1="325" x2="1130" y2="105" stroke="#64748b" stroke-width="1.5"/>
<line x1="855" y1="325" x2="1130" y2="215" stroke="#64748b" stroke-width="1.5"/>
<line x1="855" y1="325" x2="1130" y2="325" stroke="#64748b" stroke-width="1.5"/>
<circle cx="855" cy="105" r="13" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.3"/>
