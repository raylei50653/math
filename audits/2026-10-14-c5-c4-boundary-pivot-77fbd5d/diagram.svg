<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">C5 to C4 by adding a four-spoke exterior vertex</title>
  <desc id="desc">All of G is retained. A new vertex u joins b0, b1, b2, b4. The new outer boundary is u,b2,b3,b4. For its coloring A,B,C,B the old vertices b0,b1 must use C,D in either order.</desc>
  <rect width="800" height="400" fill="#fff"/>
  <path d="M310 270 L310 130 L390 65 L680 200 L390 335 Z" fill="#eef2f6"/>
  <g stroke="#334155" stroke-width="3" fill="none">
    <path d="M310 270 L310 130 L390 65 L680 200 L390 335 Z"/>
  </g>
  <g stroke="#b45309" stroke-width="3" fill="none">
    <path d="M100 200 L310 270 M100 200 L310 130 M100 200 L390 65 M100 200 L390 335"/>
  </g>
  <g stroke="#64748b" stroke-width="1.5">
    <circle cx="100" cy="200" r="9" fill="#e9a0a0"/>
    <circle cx="310" cy="270" r="9" fill="#fff"/>
    <circle cx="310" cy="130" r="9" fill="#fff"/>
    <circle cx="390" cy="65" r="9" fill="#93c5fd"/>
    <circle cx="680" cy="200" r="9" fill="#86efac"/>
    <circle cx="390" cy="335" r="9" fill="#93c5fd"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#0f172a">
    <text x="28" y="207">u = A</text>
    <text x="322" y="290">b₀</text>
    <text x="322" y="122">b₁</text>
    <text x="359" y="42">b₂ = B</text>
    <text x="697" y="207">b₃ = C</text>
    <text x="359" y="368">b₄ = B</text>
    <text x="465" y="189" font-size="26">G</text>
    <text x="420" y="218" font-size="16">all original vertices and edges</text>
    <text x="153" y="194" font-size="16">(b₀,b₁)</text>
    <text x="135" y="217" font-size="16">= (C,D) or (D,C)</text>
    <text x="24" y="26" font-size="16" fill="#b45309">Add u and four spokes</text>
    <text x="24" y="379" font-size="16">New boundary Q = (u,b₂,b₃,b₄); n_H(ABCB) = y₀ + y₁</text>
  </g>
</svg>
