name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Make room for Lean and Mathlib
        # This job does not use the preinstalled Android SDK.
        run: |
          sudo rm -rf /usr/local/lib/android
          df -h /

      - uses: actions/checkout@v5

      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Build with Mathlib and project caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "--no-ansi"
          use-mathlib-cache: true
          # Cache .lake by OS, architecture, toolchain, manifest and commit,
          # with a fallback to earlier commits using the same dependencies.
          use-github-cache: true
