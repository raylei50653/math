name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Single self-hosted runner: cancel superseded runs on the same ref.
concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Never run fork PRs on the self-hosted runner: untrusted code could persist on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lean]

    steps:
      - uses: actions/checkout@v5

      - name: Use elan toolchain
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" show

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build --no-ansi
