<style>
  #triangle-color-periods { display:grid; gap:calc(var(--font-size-base) * .7); color:var(--foreground); }

  #triangle-color-periods .cp-svg { display:block; width:100%; overflow:hidden; }
  #triangle-color-periods .cp-thumb { display:grid; width:100%; gap:calc(var(--font-size-base) * .25); }
  #triangle-color-periods .cp-thumb-svg { display:block; width:100%; height:110px; }
  #triangle-color-periods .cp-key { display:inline-flex; align-items:center; gap:calc(var(--font-size-base) * .35); }
  #triangle-color-periods .cp-key-svg { display:block; width:16px; height:16px; overflow:visible; }
  #triangle-color-periods .cp-edges { stroke:var(--foreground); stroke-opacity:.38; stroke-width:1; fill:none; }
  #triangle-color-periods .cp-geocell { stroke:var(--border); stroke-width:1; stroke-dasharray:4 4; fill:none; }
  #triangle-color-periods .cp-colorcell { stroke:var(--foreground); stroke-width:1.7; fill:none; }
  #triangle-color-periods [hidden] { display:none; }
</style>
<script>
(() => {
  const root=document.getElementById('triangle-color-periods');
  const geometry=JSON.parse(root.querySelector('#cp-geometry').textContent).examples;
  const coloringData=JSON.parse(root.querySelector('#cp-colorings').textContent).examples;
  const map=root.querySelector('#cp-map'), gallery=root.querySelector('#cp-gallery');
  const periodSelect=root.querySelector('#cp-period'), witnessSelect=root.querySelector('#cp-witness');
  const summary=root.querySelector('#cp-summary'), status=root.querySelector('#cp-status');
  const boxes=root.querySelector('#cp-boxes'), shiftX=root.querySelector('#cp-shift-x'), shiftY=root.querySelector('#cp-shift-y');
  const saved=window.openai?.widgetState?.modelContent;
  let selected=geometry.find(e=>e.id===saved?.specimen)||geometry[4];
  let period=null, witness=null, sx=0, sy=0;
  const ns='http://www.w3.org/2000/svg';
  const mod=(x,n)=>((x%n)+n)%n;
  const element=(tag,attrs={},text=null)=>{
    const n=document.createElementNS(ns,tag);
    Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));
    if(text!==null) n.textContent=text;
    return n;
  };
  const study=e=>coloringData.find(c=>c.id===e.id);
  const preferred=e=>study(e).periods.filter(p=>p.status==='SAT').sort((a,b)=>a.p*a.q-b.p*b.q)[0];
  const physical=(e,u,v)=>[u*e.basis[0][0]+v*e.basis[1][0],u*e.basis[0][1]+v*e.basis[1][1]];
  function colorAt(w,p,id,x,y,dx=0,dy=0){ return w.colors[mod(y-dy,p.q)][mod(x-dx,p.p)][id]; }
  function mark(color,x,y,r,extra={}) {
    const attrs={fill:`var(--viz-series-${color+1})`,stroke:'var(--foreground)','stroke-opacity':.45,'stroke-width':.55,...extra};
    if(color===0) return element('circle',{...attrs,cx:x,cy:y,r});
    if(color===1) return element('rect',{...attrs,x:x-r*.85,y:y-r*.85,width:r*1.7,height:r*1.7});
    if(color===2) return element('polygon',{...attrs,points:`${x},${y-r*1.18} ${x+r*1.08},${y+r*.8} ${x-r*1.08},${y+r*.8}`});
    return element('polygon',{...attrs,points:`${x},${y-r*1.2} ${x+r},${y} ${x},${y+r*1.2} ${x-r},${y}`});
  }
  function draw(e,p,w,width,height,thumb=false){
    const svg=element('svg',{viewBox:`0 0 ${width} ${height}`,width,height,class:thumb?'cp-thumb-svg':'cp-svg',role:'img','aria-label':`${e.id} ${e.name}，${w?`四色頂點染色，a方向${w.axis_period[0]}格、b方向${w.axis_period[1]}格重複`:'此指定週期沒有合法四色染法'}`});
    svg.append(element('title',{},`${e.id} ${e.name} 的染色週期`));
    const px=thumb?1:p.p, qy=thumb?1:p.q;
    const center=physical(e,px/2,qy/2);
    const scale=thumb?Math.min(width/2.2,height/1.6):Math.min(width/Math.max(3.15,px+.65),height/Math.max(2.65,qy+.65));
    const xy=(u,v)=>{const a=physical(e,u,v);return[(a[0]-center[0])*scale+width/2,height/2-(a[1]-center[1])*scale];};
    const cell=(x,y,a=1,b=1)=>[[x,y],[x+a,y],[x+a,y+b],[x,y+b]].map(v=>xy(...v).join(',')).join(' ');
    const lines=[];
    const range=thumb?4:7;
    for(let x=-range;x<=range;x++) for(let y=-range;y<=range;y++) for(const [a,b,dx,dy] of e.edges){
      const u=xy(e.points[a][0]+x,e.points[a][1]+y),v=xy(e.points[b][0]+x+dx,e.points[b][1]+y+dy);
      if(Math.max(u[0],v[0])<0||Math.min(u[0],v[0])>width||Math.max(u[1],v[1])<0||Math.min(u[1],v[1])>height)continue;
      lines.push(`M${u[0].toFixed(2)},${u[1].toFixed(2)}L${v[0].toFixed(2)},${v[1].toFixed(2)}`);
    }
    svg.append(element('path',{d:lines.join(''),class:'cp-edges'}));
    for(let x=-range;x<=range;x++) for(let y=-range;y<=range;y++) e.points.forEach((point,id)=>{
      const a=xy(point[0]+x,point[1]+y);
      if(a[0]<-8||a[0]>width+8||a[1]<-8||a[1]>height+8)return;
      if(!w){svg.append(element('circle',{cx:a[0],cy:a[1],r:thumb?1.5:2.2,fill:'var(--foreground)'}));return;}
      const color=colorAt(w,p,id,x,y,thumb?0:sx,thumb?0:sy);
      const m=mark(color,a[0],a[1],thumb?2.3:4.8,{'data-color':color,'data-vertex':`${id},${x},${y}`});
      if(!thumb)m.setAttribute('data-tooltip',`頂點 ${id} · 色號 ${'ABCD'[color]} · 單元 (${x},${y})`);
      svg.append(m);
    });
    if(!thumb&&boxes.checked){
      for(let x=-4;x<=6;x++) for(let y=-4;y<=6;y++) svg.append(element('polygon',{points:cell(x,y),class:'cp-geocell'}));
      if(w)svg.append(element('polygon',{points:cell(0,0,p.p,p.q),class:'cp-colorcell'}));
    }
    return svg;
  }
  function shiftDescription(){
    if(!witness)return `這個晶體無法以 ${period.p}×${period.q} 單元原色重複四色染色。`;
    let changed=0;
    const mapping=new Map();let permutation=true;
    for(let y=0;y<period.q;y++)for(let x=0;x<period.p;x++)for(let id=0;id<selected.points.length;id++){
      const a=colorAt(witness,period,id,x,y),b=colorAt(witness,period,id,x,y,sx,sy);
      if(a!==b)changed++;
      if(mapping.has(a)&&mapping.get(a)!==b)permutation=false;
      mapping.set(a,b);
    }
    if(new Set(mapping.values()).size!==mapping.size)permutation=false;
    const location=`平移 (${sx}, ${sy})`;
    if(!changed)return `${location} · 原色完全重合`;
    if(permutation)return `${location} · 整體換色後重合：${[...mapping].sort().filter(([a,b])=>a!==b).map(([a,b])=>`${'ABCD'[a]}→${'ABCD'[b]}`).join('，')}`;
    return `${location} · ${changed}／${selected.points.length*period.p*period.q} 個對應點變色，無法只靠整體換色重合`;
  }
  function redraw(){
    if(!selected||!period)return;
    const width=Math.max(280,Math.round(map.getBoundingClientRect().width));
    map.replaceChildren(draw(selected,period,witness,width,Math.round(Math.max(320,Math.min(480,width*.65)))));
    const extra=witness?`這份染色沿 a 每 ${witness.axis_period[0]} 格、沿 b 每 ${witness.axis_period[1]} 格原色重複`:'';
    summary.textContent=`${selected.id} ${selected.name} · 幾何單元 ${selected.stats.vertices} 點${extra?' · '+extra:''}`;
    status.textContent=shiftDescription();
    shiftX.disabled=!witness||period.p===1;shiftY.disabled=!witness||period.q===1;
    for(const b of gallery.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.specimen===selected.id));
    for(const old of gallery.querySelectorAll('.cp-thumb-svg')){
      const e=geometry.find(g=>g.id===old.dataset.specimen),p=preferred(e);
      const replacement=draw(e,p,p.witnesses[0],Math.max(140,Math.round(old.parentElement.getBoundingClientRect().width)),110,true);
      replacement.dataset.specimen=e.id;old.replaceWith(replacement);
    }
  }
  function save(){
    if(typeof window.openai?.setWidgetState==='function')window.openai.setWidgetState({modelContent:{specimen:selected.id,period:[period.p,period.q],witness:witness?.id,shift:[sx,sy],showBoxes:boxes.checked},privateContent:null}).catch(()=>{});
  }
  function updateWitness(preferId){
    witnessSelect.replaceChildren();
    for(const w of period.witnesses){const option=document.createElement('option');option.value=w.id;option.textContent=`染法 ${period.witnesses.indexOf(w)+1} · ${w.axis_period.join('×')}`;witnessSelect.append(option);}
    witness=period.witnesses.find(w=>w.id===preferId)||period.witnesses[0]||null;
    if(witness)witnessSelect.value=witness.id;
    else{const option=document.createElement('option');option.textContent='此週期無染法';witnessSelect.append(option);}
    witnessSelect.disabled=period.witnesses.length<2;sx=0;sy=0;redraw();
  }
  function selectSpecimen(e,requestedPeriod=null,requestedWitness=null){
    selected=e;periodSelect.replaceChildren();
    for(const p of study(e).periods){const option=document.createElement('option');option.value=`${p.p},${p.q}`;option.textContent=`${p.p}×${p.q} · ${p.status==='SAT'?'可行':'此週期不可行'}`;periodSelect.append(option);}
    period=study(e).periods.find(p=>requestedPeriod&&p.p===requestedPeriod[0]&&p.q===requestedPeriod[1])||preferred(e);
    periodSelect.value=`${period.p},${period.q}`;updateWitness(requestedWitness);
  }
  for(let c=0;c<4;c++){
    const item=document.createElement('span');item.className='cp-key';const svg=element('svg',{viewBox:'0 0 16 16',class:'cp-key-svg','aria-hidden':'true'});svg.append(mark(c,8,8,4.5));item.append(svg,document.createTextNode('ABCD'[c]));root.querySelector('#cp-legend').append(item);
  }
  for(const text of ['虛線：幾何單元','實線：選定的染色重複框']){const span=document.createElement('span');span.textContent=text;root.querySelector('#cp-legend').append(span);}
  for(const e of geometry){
    const p=preferred(e),w=p.witnesses[0];
    const button=document.createElement('button');button.type='button';button.className='btn viz-tile';button.dataset.specimen=e.id;button.setAttribute('aria-label',`${e.id} ${e.name}`);
    const content=document.createElement('span');content.className='cp-thumb';const label=document.createElement('span');label.textContent=`${e.id} · ${e.name}`;
    const svg=draw(e,p,w,180,110,true);svg.dataset.specimen=e.id;content.append(label,svg);button.append(content);gallery.append(button);
    button.addEventListener('click',()=>{selectSpecimen(e);save();});
  }
  periodSelect.addEventListener('change',()=>{period=study(selected).periods.find(p=>`${p.p},${p.q}`===periodSelect.value);updateWitness();save();});
  witnessSelect.addEventListener('change',()=>{witness=period.witnesses.find(w=>w.id===witnessSelect.value);sx=0;sy=0;redraw();save();});
  shiftX.addEventListener('click',()=>{sx=mod(sx+1,period.p);redraw();save();});
  shiftY.addEventListener('click',()=>{sy=mod(sy+1,period.q);redraw();save();});
  boxes.addEventListener('change',()=>{redraw();save();});
  window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState?.modelContent;if(!state?.specimen)return;const e=geometry.find(g=>g.id===state.specimen);if(!e)return;selectSpecimen(e,state.period,state.witness);sx=mod(state.shift?.[0]||0,period.p);sy=mod(state.shift?.[1]||0,period.q);boxes.checked=state.showBoxes!==false;redraw();});
  boxes.checked=saved?.showBoxes!==false;
  selectSpecimen(selected,saved?.period,saved?.witness);
