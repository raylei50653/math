<script>
(() => {
  const root = document.getElementById('triangle-crystals-atlas');
  const data = JSON.parse(root.querySelector('#tc-catalog').textContent);
  const specimens = data.examples;
  const main = root.querySelector('#tc-main');
  const gallery = root.querySelector('#tc-gallery');
  const summary = root.querySelector('#tc-summary');
  const legend = root.querySelector('#tc-legend');
  const cellToggle = root.querySelector('#tc-cell');
  const degreeToggle = root.querySelector('#tc-degree');
  const ns = 'http://www.w3.org/2000/svg';
  const saved = window.openai?.widgetState?.modelContent;
  let selected = specimens.find(e => e.id === saved?.specimen) || specimens[9] || specimens[0];
  cellToggle.checked = saved?.showCell !== false;
  degreeToggle.checked = saved?.showDegrees === true;
  const node = (tag, attrs = {}, text = null) => {
    const result = document.createElementNS(ns, tag);
    for (const [key, value] of Object.entries(attrs)) result.setAttribute(key, value);
    if (text !== null) result.textContent = text;
    return result;
  };
  const physical = (e, u, v) => [u * e.basis[0][0] + v * e.basis[1][0], u * e.basis[0][1] + v * e.basis[1][1]];
  const degreeColor = d => d <= 4 ? 'var(--viz-series-2)' : d === 5 ? 'var(--viz-series-3)' : d === 6 ? 'var(--background)' : d === 7 ? 'var(--viz-series-4)' : 'var(--viz-series-5)';
  function drawMap(e, width, height, thumb = false) {
    const svg = node('svg', { viewBox: `0 0 ${width} ${height}`, width, height, class: thumb ? 'tc-thumb-svg' : 'tc-map', role: 'img', 'aria-label': `${e.id} ${e.name}，${e.stats.vertices} 個頂點組成的週期單元，向平面重複延伸` });
    svg.append(node('title', {}, `${e.id} ${e.name}`));
    svg.append(node('desc', {}, `所有面都是三角形。虛線框表示選用的重複單元；框外連邊接到相鄰單元。每個頂點的度數計入跨單元的全部鄰點。`));
    const center = physical(e, .5, .5);
    const scale = Math.min(height / (thumb ? 1.6 : 2.65), width / (thumb ? 2.2 : 3.15));
    const xy = (u, v) => {
      const p = physical(e, u, v);
      return [(p[0] - center[0]) * scale + width / 2, height / 2 - (p[1] - center[1]) * scale];
    };
    const visible = (p, pad = 12) => p[0] >= -pad && p[0] <= width + pad && p[1] >= -pad && p[1] <= height + pad;
    const cellPoints = (i, j) => [[i,j],[i+1,j],[i+1,j+1],[i,j+1]].map(p => xy(...p).join(',')).join(' ');
    const showCell = !thumb && cellToggle.checked;
    const showDegrees = !thumb && degreeToggle.checked;
    if (showCell) svg.append(node('polygon', { points: cellPoints(0,0), fill: 'var(--viz-series-1)', 'fill-opacity': .07 }));

    for (let i = -5; i <= 5; i++) for (let j = -5; j <= 5; j++) {
      for (const [u,v,dx,dy] of e.edges) {
        const p = xy(e.points[u][0]+i, e.points[u][1]+j);
        const q = xy(e.points[v][0]+i+dx, e.points[v][1]+j+dy);
        if (Math.max(p[0],q[0]) < -5 || Math.min(p[0],q[0]) > width+5 || Math.max(p[1],q[1]) < -5 || Math.min(p[1],q[1]) > height+5) continue;
        path.push(`M${p[0].toFixed(2)},${p[1].toFixed(2)}L${q[0].toFixed(2)},${q[1].toFixed(2)}`);
      }
    }
    svg.append(node('path', { d: path.join(''), class: 'tc-edge' }));
    for (let i = -4; i <= 4; i++) for (let j = -4; j <= 4; j++) {
      e.points.forEach((p, id) => {
        const q = xy(p[0]+i,p[1]+j);
        if (!visible(q)) return;
        const degree = e.degrees[id];
        let separation = Infinity;
        if (showDegrees) {
          for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) e.points.forEach((other, otherId) => {
            if (di === 0 && dj === 0 && id === otherId) return;
            const r = xy(other[0]+i+di, other[1]+j+dj);
            separation = Math.min(separation, Math.hypot(r[0]-q[0], r[1]-q[1]));
          });
        }
        const attrs = { cx: q[0], cy: q[1], r: showDegrees ? Math.min(8, separation * .42) : thumb ? 1.45 : 2.3, fill: showDegrees ? degreeColor(degree) : 'var(--foreground)' };
        if (showDegrees) {
          attrs['fill-opacity'] = degree === 6 ? 1 : .24;
          attrs.stroke = 'var(--foreground)';
          attrs['stroke-opacity'] = .28;
          attrs['stroke-width'] = .7;
        }
        if (showDegrees) attrs['data-tooltip'] = `頂點 ${id}：${degree} 度`;
        svg.append(node('circle', attrs));
        if (showDegrees && separation >= 18 && visible(q,-9)) svg.append(node('text', { x:q[0], y:q[1], class:'tc-number', 'font-size':12 }, degree));
      });
    }
    if (showCell) {
      for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
        if (i || j) svg.append(node('polygon', { points:cellPoints(i,j), class:'tc-repeat-boundary' }));
      }
      svg.append(node('polygon', { points:cellPoints(0,0), class:'tc-boundary' }));
    }
    return svg;
  }
  function redraw() {
    if (!selected) return;
    const width = Math.max(280, Math.round(main.getBoundingClientRect().width));
    const height = Math.round(Math.max(300, Math.min(460, width * .63)));
    main.replaceChildren(drawMap(selected,width,height));
    const counts = Object.entries(selected.stats.degree_counts).map(([d,n]) => `${d}度×${n}`).join('、');
    summary.textContent = `${selected.id} ${selected.name} · 每單元 ${selected.stats.vertices} 點／${selected.stats.faces} 個三角形 · ${counts}`;
    for (const button of gallery.querySelectorAll('button')) button.setAttribute('aria-pressed', String(button.dataset.specimen === selected.id));
    legend.hidden = !degreeToggle.checked;
    gallery.querySelectorAll('.tc-thumb-svg').forEach(svg => {
      const entry = specimens.find(e => e.id === svg.dataset.specimen);
      const width = Math.max(140, Math.round(svg.parentElement.getBoundingClientRect().width));
      const replacement = drawMap(entry,width,110,true);
      replacement.dataset.specimen = entry.id;
      svg.replaceWith(replacement);
    });
  }
  function persist() {
    if (typeof window.openai?.setWidgetState === 'function') {
      window.openai.setWidgetState({ modelContent: { specimen:selected.id, showCell:cellToggle.checked, showDegrees:degreeToggle.checked }, privateContent:null }).catch(() => {});
    }
  }
  for (const [label,degree] of [['≤4 度',4],['5 度',5],['6 度',6],['7 度',7],['≥8 度',8]]) {
    const item = document.createElement('span'); item.className = 'tc-legend-item';
    const swatch = document.createElement('span'); swatch.className='tc-swatch'; swatch.style.background = degree === 6 ? 'var(--foreground)' : degreeColor(degree); swatch.style.opacity='.6';
    item.append(swatch,document.createTextNode(label)); legend.append(item);
  }
  for (const e of specimens) {
    const button = document.createElement('button'); button.type='button'; button.className='btn viz-tile'; button.dataset.specimen=e.id; button.setAttribute('aria-pressed',String(e===selected)); button.setAttribute('aria-label',`${e.id} ${e.name}，每單元${e.stats.vertices}點`);
    const content = document.createElement('span'); content.className='tc-thumb';
    const label = document.createElement('span'); label.textContent=`${e.id} · ${e.name}`;
    const svg=drawMap(e,180,110,true); svg.dataset.specimen=e.id;
    content.append(label,svg); button.append(content);
    button.addEventListener('click',()=>{ selected=e; redraw(); persist(); }); gallery.append(button);
  }
  cellToggle.addEventListener('change',()=>{ redraw(); persist(); });
  degreeToggle.addEventListener('change',()=>{ redraw(); persist(); });
  window.addEventListener('openai:set_globals',event=>{
    const state=event.detail?.globals?.widgetState?.modelContent;
    if (!state) return;
    selected=specimens.find(e=>e.id===state.specimen)||selected;
    cellToggle.checked=state.showCell!==false; degreeToggle.checked=state.showDegrees===true; redraw();
  });
  new ResizeObserver(redraw).observe(main);
  redraw();
})();
</script>
