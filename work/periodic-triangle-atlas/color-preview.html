&lt;style&gt;
  #triangle-color-periods { display:grid; gap:calc(var(--font-size-base) * .7); color:var(--foreground); }

  #triangle-color-periods .cp-thumb { display:grid; width:100%; gap:calc(var(--font-size-base) * .25); }
  #triangle-color-periods .cp-thumb-svg { display:block; width:100%; height:110px; }

  #triangle-color-periods .cp-key-svg { display:block; width:16px; height:16px; overflow:visible; }

  #triangle-color-periods [hidden] { display:none; }

&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;triangle-color-periods&#x27;);
  const geometry=JSON.parse(root.querySelector(&#x27;#cp-geometry&#x27;).textContent).examples;
  const coloringData=JSON.parse(root.querySelector(&#x27;#cp-colorings&#x27;).textContent).examples;
  const map=root.querySelector(&#x27;#cp-map&#x27;), gallery=root.querySelector(&#x27;#cp-gallery&#x27;);
  const periodSelect=root.querySelector(&#x27;#cp-period&#x27;), witnessSelect=root.querySelector(&#x27;#cp-witness&#x27;);
  const summary=root.querySelector(&#x27;#cp-summary&#x27;), status=root.querySelector(&#x27;#cp-status&#x27;);
  const boxes=root.querySelector(&#x27;#cp-boxes&#x27;), shiftX=root.querySelector(&#x27;#cp-shift-x&#x27;), shiftY=root.querySelector(&#x27;#cp-shift-y&#x27;);
  const saved=window.openai?.widgetState?.modelContent;
  let selected=geometry.find(e=&gt;e.id===saved?.specimen)||geometry[4];
  let period=null, witness=null, sx=0, sy=0;
  const ns=&#x27;http://www.w3.org/2000/svg&#x27;;
  const mod=(x,n)=&gt;((x%n)+n)%n;
  const element=(tag,attrs={},text=null)=&gt;{
    const n=document.createElementNS(ns,tag);
    Object.entries(attrs).forEach(([k,v])=&gt;n.setAttribute(k,v));
    if(text!==null) n.textContent=text;
    return n;
  };
  const study=e=&gt;coloringData.find(c=&gt;c.id===e.id);
  const preferred=e=&gt;study(e).periods.filter(p=&gt;p.status===&#x27;SAT&#x27;).sort((a,b)=&gt;a.p*a.q-b.p*b.q)[0];
  const physical=(e,u,v)=&gt;[u*e.basis[0][0]+v*e.basis[1][0],u*e.basis[0][1]+v*e.basis[1][1]];
  function colorAt(w,p,id,x,y,dx=0,dy=0){ return w.colors[mod(y-dy,p.q)][mod(x-dx,p.p)][id]; }
  function mark(color,x,y,r,extra={}) {
    const attrs={fill:`var(--viz-series-${color+1})`,stroke:&#x27;var(--foreground)&#x27;,&#x27;stroke-opacity&#x27;:.45,&#x27;stroke-width&#x27;:.55,...extra};
    if(color===0) return element(&#x27;circle&#x27;,{...attrs,cx:x,cy:y,r});
    if(color===1) return element(&#x27;rect&#x27;,{...attrs,x:x-r*.85,y:y-r*.85,width:r*1.7,height:r*1.7});
    if(color===2) return element(&#x27;polygon&#x27;,{...attrs,points:`${x},${y-r*1.18} ${x+r*1.08},${y+r*.8} ${x-r*1.08},${y+r*.8}`});
    return element(&#x27;polygon&#x27;,{...attrs,points:`${x},${y-r*1.2} ${x+r},${y} ${x},${y+r*1.2} ${x-r},${y}`});
  }
  function draw(e,p,w,width,height,thumb=false){
    const svg=element(&#x27;svg&#x27;,{viewBox:`0 0 ${width} ${height}`,width,height,class:thumb?&#x27;cp-thumb-svg&#x27;:&#x27;cp-svg&#x27;,role:&#x27;img&#x27;,&#x27;aria-label&#x27;:`${e.id} ${e.name}，${w?`四色頂點染色，a方向${w.axis_period[0]}格、b方向${w.axis_period[1]}格重複`:&#x27;此指定週期沒有合法四色染法&#x27;}`});
    svg.append(element(&#x27;title&#x27;,{},`${e.id} ${e.name} 的染色週期`));
